<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Seva Bandhus</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Inter',sans-serif;
    background:#f8fafc;
    color:#111827;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

/* =========================
   VARIABLES
========================= */

:root{

    --primary:#2563eb;
    --primary-dark:#1d4ed8;

    --bg:#f8fafc;
    --white:#ffffff;

    --text:#111827;
    --text-light:#6b7280;

    --border:#e5e7eb;

    --shadow-sm:0 1px 3px rgba(0,0,0,0.06);
    --shadow-md:0 4px 14px rgba(0,0,0,0.08);

    --radius:14px;
}

/* =========================
   NAVBAR
========================= */

.navbar{

    position:sticky;
    top:0;
    z-index:1000;

    height:70px;

    background:rgba(255,255,255,0.9);

    backdrop-filter:blur(10px);

    border-bottom:1px solid var(--border);

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 40px;
}

/* Logo */

.logo{
    display:flex;
    align-items:center;
    gap:12px;

    text-decoration:none;
}

.logo-box{

    width:38px;
    height:38px;

    border-radius:12px;

    background:var(--primary);

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;
    font-weight:800;
    font-size:14px;

    box-shadow:var(--shadow-sm);
}

.logo-text{

    font-size:18px;
    font-weight:700;
    color:var(--text);
}

.logo-text span{
    color:var(--primary);
}

/* Nav Links */

.nav-links{

    list-style:none;

    display:flex;
    align-items:center;
    gap:10px;
}

.nav-links li a{

    text-decoration:none;

    color:var(--text-light);

    font-size:14px;
    font-weight:500;

    padding:10px 16px;

    border-radius:10px;

    transition:0.25s;
}

.nav-links li a:hover{

    background:#eff6ff;
    color:var(--primary);
}

/* =========================
   MAIN CONTAINER
========================= */

.container{

    flex:1;

    width:100%;

    padding:40px;
}

/* =========================
   PAGE HEADER
========================= */

.page-header{

    margin-bottom:30px;
}

.page-title{

    font-size:30px;
    font-weight:800;

    color:var(--text);

    margin-bottom:8px;
}

.page-subtitle{

    color:var(--text-light);

    font-size:15px;
}

/* =========================
   GRID
========================= */

.grid-2{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.grid-3{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.grid-4{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

/* =========================
   CARD
========================= */

.card{

    background:var(--white);

    border:1px solid var(--border);

    border-radius:var(--radius);

    padding:24px;

    box-shadow:var(--shadow-sm);

    transition:0.25s;
}

.card:hover{

    transform:translateY(-2px);

    box-shadow:var(--shadow-md);
}

.card-title{

    font-size:18px;
    font-weight:700;

    margin-bottom:16px;

    color:var(--text);
}

.card-subtitle{

    color:var(--text-light);

    font-size:14px;

    margin-bottom:20px;
}

/* =========================
   STAT CARDS
========================= */

.stat-card{

    background:white;

    border:1px solid var(--border);

    border-radius:16px;

    padding:24px;

    box-shadow:var(--shadow-sm);

    transition:0.25s;
}

.stat-card:hover{

    transform:translateY(-3px);

    box-shadow:var(--shadow-md);
}

.stat-title{

    color:var(--text-light);

    font-size:13px;

    margin-bottom:12px;

    text-transform:uppercase;
    letter-spacing:1px;
}

.stat-number{

    font-size:32px;
    font-weight:800;

    color:var(--text);
}

/* =========================
   BUTTONS
========================= */

.btn{

    border:none;

    padding:12px 18px;

    border-radius:10px;

    font-size:14px;
    font-weight:600;

    cursor:pointer;

    transition:0.25s;

    text-decoration:none;

    display:inline-flex;
    align-items:center;
    justify-content:center;
}

.btn-primary{

    background:var(--primary);
    color:white;
}

.btn-primary:hover{

    background:var(--primary-dark);

    transform:translateY(-1px);
}

.btn-secondary{

    background:white;

    color:var(--text);

    border:1px solid var(--border);
}

.btn-secondary:hover{

    background:#f9fafb;
}

/* =========================
   FORMS
========================= */

.form-group{
    margin-bottom:20px;
}

.form-label{

    display:block;

    margin-bottom:8px;

    font-size:14px;
    font-weight:600;

    color:var(--text);
}

.form-input,
.form-select,
.form-textarea{

    width:100%;

    padding:13px 14px;

    border:1px solid var(--border);

    border-radius:12px;

    font-size:14px;

    background:white;

    transition:0.25s;
}

.form-input:focus,
.form-select:focus,
.form-textarea:focus{

    outline:none;

    border-color:var(--primary);

    box-shadow:0 0 0 4px rgba(37,99,235,0.1);
}

/* =========================
   TABLES
========================= */

.table-wrapper{

    overflow-x:auto;

    background:white;

    border:1px solid var(--border);

    border-radius:16px;

    box-shadow:var(--shadow-sm);
}

table{

    width:100%;

    border-collapse:collapse;
}

thead{

    background:#f9fafb;
}

thead th{

    padding:16px;

    text-align:left;

    font-size:13px;
    font-weight:700;

    color:var(--text-light);

    text-transform:uppercase;
}

tbody td{

    padding:16px;

    border-top:1px solid #f1f5f9;

    font-size:14px;
}

tbody tr:hover{

    background:#f8fafc;
}

/* =========================
   BADGES
========================= */

.badge{

    display:inline-flex;

    align-items:center;

    padding:6px 12px;

    border-radius:999px;

    font-size:12px;
    font-weight:600;
}

.badge-success{

    background:#dcfce7;
    color:#166534;
}

.badge-warning{

    background:#fef3c7;
    color:#92400e;
}

.badge-danger{

    background:#fee2e2;
    color:#991b1b;
}

.badge-info{

    background:#dbeafe;
    color:#1d4ed8;
}

/* =========================
   ALERTS
========================= */

.alert{

    padding:16px 18px;

    border-radius:12px;

    margin-bottom:20px;

    font-size:14px;
    font-weight:500;
}

.alert-success{

    background:#ecfdf5;
    color:#065f46;

    border:1px solid #a7f3d0;
}

.alert-error{

    background:#fef2f2;
    color:#991b1b;

    border:1px solid #fecaca;
}

/* =========================
   FOOTER
========================= */

footer{

    background:white;

    border-top:1px solid var(--border);

    text-align:center;

    padding:20px;

    font-size:14px;

    color:var(--text-light);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:992px){

    .grid-4{
        grid-template-columns:repeat(2,1fr);
    }

    .grid-3{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:768px){

    .navbar{

        padding:0 20px;

        flex-direction:column;

        height:auto;

        padding-top:18px;
        padding-bottom:18px;

        gap:16px;
    }

    .container{
        padding:24px;
    }

    .grid-2,
    .grid-3,
    .grid-4{

        grid-template-columns:1fr;
    }

    .page-title{
        font-size:24px;
    }
}

@media(max-width:480px){

    .nav-links{

        flex-wrap:wrap;
        justify-content:center;
    }

    .container{
        padding:18px;
    }
}

</style>
</head>

<body>

<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar">

    <a href="{% url 'home' %}" class="logo">

        <div class="logo-box">
            SB
        </div>

        <div class="logo-text">
            Seva <span>Bandhu</span>
        </div>

    </a>

    <ul class="nav-links">

        <li>
            <a href="{% url 'home' %}">
                Home
            </a>
        </li>

        <li>
            <a href="{% url 'customer_signup' %}">
                Customer
            </a>
        </li>

        <li>
            <a href="{% url 'technician_signup' %}">
                Technician
            </a>
        </li>

        {% if request.user.is_staff %}
        <li>
            <a href="{% url 'admin_dashboard' %}">
                Admin Dashboard
            </a>
        </li>
        {% endif %}

    </ul>

</nav>

<!-- =========================
     MAIN CONTENT
========================= -->

<div class="container">

    {% block content %}
    {% endblock %}

</div>

<!-- =========================
     FOOTER
========================= -->

<footer>

    © 2026 Seva Bandhu | Technician Service Assigning System

</footer>

</body>
</html>
