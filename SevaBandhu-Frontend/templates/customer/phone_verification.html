<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Verification</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            min-height:100vh;

            display:flex;
            align-items:center;
            justify-content:center;

            padding:24px;

            font-family:'Inter',sans-serif;

            background:#f8fafc;
        }

        main{

            width:100%;
            max-width:460px;

            background:white;

            padding:42px 36px;

            border-radius:28px;

            border:1px solid #e5e7eb;

            box-shadow:0 10px 30px rgba(0,0,0,0.06);

            text-align:center;
        }

        /* ===== Icon ===== */

        .verify-icon{

            width:90px;
            height:90px;

            margin:0 auto 24px;

            border-radius:50%;

            background:#eff6ff;

            display:flex;
            align-items:center;
            justify-content:center;

            font-size:38px;
        }

        /* ===== Heading ===== */

        h1{

            color:#111827;

            font-size:32px;
            font-weight:800;

            margin-bottom:12px;

            letter-spacing:-1px;
        }

        /* ===== Subtitle ===== */

        .subtitle{

            color:#6b7280;

            font-size:15px;

            line-height:1.7;

            margin-bottom:30px;
        }

        /* ===== User Box ===== */

        .user-box{

            background:#f8fafc;

            border:1px solid #e5e7eb;

            padding:20px;

            border-radius:18px;

            margin-top:10px;
        }

        /* ===== Loading Badge ===== */

        .status-badge{

            display:inline-flex;

            align-items:center;
            justify-content:center;

            gap:8px;

            background:#ecfdf5;

            color:#166534;

            padding:10px 16px;

            border-radius:999px;

            font-size:13px;
            font-weight:700;

            margin-bottom:24px;
        }

        /* ===== Responsive ===== */

        @media(max-width:600px){

            main{
                padding:34px 24px;
                border-radius:22px;
            }

            h1{
                font-size:28px;
            }

            .subtitle{
                font-size:14px;
            }

        }

    </style>
</head>

<body>

<main>
   
    <div class="verify-icon">
        📱
    </div>

  <div id="recaptcha-container"></div>

    <h1>Phone Verification</h1>

    <p class="subtitle">
      Your account signup was successful.
Continue with phone verification to complete setup securely.
    </p>

    <div class="user-box">

        <p id="google-user">

            Loading user information...

        </p>

        <div style="margin-top:24px;">

            <input
                type="text"
                id="phone"
                placeholder="+91XXXXXXXXXX"
                style="
                    width:100%;
                    padding:14px;
                    border:1px solid #d1d5db;
                    border-radius:14px;
                    margin-bottom:16px;
                    font-size:15px;
                "
            >

            <button
                onclick="sendOTP()"
                style="
                    width:100%;
                    padding:14px;
                    border:none;
                    border-radius:14px;
                    background:#2563eb;
                    color:white;
                    font-weight:700;
                    cursor:pointer;
                    margin-bottom:18px;
                "
            >
                Send OTP
            </button>

            <input
                type="text"
                id="otp"
                placeholder="Enter OTP"
                style="
                    width:100%;
                    padding:14px;
                    border:1px solid #d1d5db;
                    border-radius:14px;
                    margin-bottom:16px;
                    font-size:15px;
                "
            >

            <button
                onclick="verifyOTP()"
                style="
                    width:100%;
                    padding:14px;
                    border:none;
                    border-radius:14px;
                    background:#16a34a;
                    color:white;
                    font-weight:700;
                    cursor:pointer;
                "
            >
                Verify OTP
            </button>

        </div>

    </div>

</main>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

    getAuth,

    RecaptchaVerifier,

    signInWithPhoneNumber

}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
/////////////////////////////////////////////////////
// FIREBASE CONFIG
/////////////////////////////////////////////////////

const firebaseConfig = {

    apiKey: "{{ FIREBASE_API_KEY|escapejs }}",

    authDomain: "{{ FIREBASE_AUTH_DOMAIN|escapejs }}",

    projectId: "{{ FIREBASE_PROJECT_ID|escapejs }}",

    storageBucket: "{{ FIREBASE_STORAGE_BUCKET|escapejs }}",

    messagingSenderId: "{{ FIREBASE_MESSAGING_SENDER_ID|escapejs }}",

    appId: "{{ FIREBASE_APP_ID|escapejs }}"
};

/////////////////////////////////////////////////////
// INITIALIZE
/////////////////////////////////////////////////////

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

window.recaptchaVerifier =
new RecaptchaVerifier(

    auth,

    'recaptcha-container',

    {
        size: 'invisible'
    }

);

window.sendOTP = function() {

    const phoneNumber =
        document.getElementById(
            "phone"
        ).value;

    const appVerifier =
        window.recaptchaVerifier;

    signInWithPhoneNumber(

        auth,

        phoneNumber,

        appVerifier

    )

    .then((confirmationResult) => {

        window.confirmationResult =
            confirmationResult;

        alert("OTP Sent 😎🔥");

    })

    .catch((error) => {

        alert(error.message);

    });
}

window.verifyOTP = function() {

    const code =
        document.getElementById(
            "otp"
        ).value;

    window.confirmationResult.confirm(code)

    .then((result) => {

        alert("Phone Verified 😎🔥");

        const phone = document.getElementById('phone').value || '';
        const csrftoken = getCookie('csrftoken');

        fetch('/customer/phone-verify-complete/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrftoken
            },
            body: JSON.stringify({
                phone: phone
            })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                window.location.href = '/customer/login/';
            } else {
                alert('Verification succeeded locally but server update failed: ' + (data.message || ''));
            }
        })
        .catch(err => {
            console.error(err);
            alert('Verification succeeded locally but server update failed. Redirecting to login.');
            window.location.href = '/customer/login/';
        });

    })

    .catch((error) => {

        alert('Invalid OTP');

    });
}

/////////////////////////////////////////////////////
// CHECK AUTH USER
/////////////////////////////////////////////////////


function getCookie(name) {

    let cookieValue = null;

    if (document.cookie && document.cookie !== '') {

        const cookies = document.cookie.split(';');

        for (let i = 0; i < cookies.length; i++) {

            const cookie = cookies[i].trim();

            if (

                cookie.substring(

                    0,

                    name.length + 1

                ) === (name + '=')

            ) {

                cookieValue = decodeURIComponent(

                    cookie.substring(
                        name.length + 1
                    )
                );

                break;

            }

        }

    }

    return cookieValue;
}
</script>

</body>
</html>
