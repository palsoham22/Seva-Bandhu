<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | Seva Bandhu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root { --ink:#14213d; --muted:#64748b; --line:#d9e2ec; --blue:#1769e0; --danger:#b42318; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; padding:32px 18px; display:grid; place-items:center; background:#f4f8fc; color:var(--ink); font-family:'DM Sans',sans-serif; }
        .shell { width:100%; max-width:460px; }
        .brand { display:flex; justify-content:center; align-items:center; gap:10px; margin-bottom:22px; font-weight:700; letter-spacing:.02em; }
        .mark { width:34px; height:34px; display:grid; place-items:center; border-radius:10px; background:var(--blue); color:#fff; font-family:Manrope,sans-serif; }
        .panel { padding:40px 38px 30px; background:#fff; border:1px solid #e1e9f2; border-radius:24px; box-shadow:0 18px 50px rgba(20,33,61,.08); }
        h1 { margin:0; text-align:center; font:800 31px/1.15 Manrope,sans-serif; letter-spacing:-.03em; }
        .intro { margin:12px auto 30px; color:var(--muted); text-align:center; line-height:1.55; }
        .alert { padding:13px 15px; margin-bottom:22px; border:1px solid #f4c7c1; border-radius:12px; color:var(--danger); background:#fff4f2; font-size:14px; line-height:1.45; }
        .field { margin-bottom:20px; }
        label { display:block; margin-bottom:8px; font-size:14px; font-weight:700; }
        input { width:100%; min-height:50px; padding:0 14px; border:1px solid var(--line); border-radius:12px; font:500 15px 'DM Sans',sans-serif; color:var(--ink); }
        input:focus { outline:0; border-color:var(--blue); box-shadow:0 0 0 4px rgba(23,105,224,.12); }
        .submit { width:100%; min-height:50px; border:0; border-radius:12px; background:var(--blue); color:white; cursor:pointer; font:700 15px 'DM Sans',sans-serif; box-shadow:0 8px 18px rgba(23,105,224,.22); }
        .submit:hover { background:#1259bf; }
        .signup { margin-top:26px; padding-top:22px; border-top:1px solid #e7edf4; text-align:center; color:var(--muted); font-size:14px; }
        .signup a { display:inline-block; margin-top:9px; color:var(--blue); font-weight:700; text-decoration:none; }
        .signup a:hover { text-decoration:underline; }
        @media(max-width:520px) { body { padding:16px 12px; } .panel { padding:30px 20px 25px; } h1 { font-size:27px; } }
    </style>
</head>
<body>
<main class="shell">
    <div class="brand"><span class="mark">S</span><span>Seva Bandhu</span></div>
    <section class="panel">
        <h1>Welcome back</h1>
        <p class="intro">Sign in to manage your service requests and stay updated from one place.</p>
        {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="field"><label for="username">Username</label><input id="username" name="username" type="text" value="{{ username|default:'' }}" autocomplete="username" required autofocus></div>
            <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
            <button class="submit" type="submit">Sign in</button>
        </form>
        <div class="signup">New to Seva Bandhu?<br><a href="{% url 'customer_signup' %}">Create a customer account</a></div>
    </section>
</main>
</body>
</html>
